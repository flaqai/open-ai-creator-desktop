name: Publish desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAQ_REQUIRE_BUNDLED_R2: 'true'
          FLAQ_BUNDLED_R2_ACCOUNT_ID: ${{ secrets.FLAQ_BUNDLED_R2_ACCOUNT_ID }}
          FLAQ_BUNDLED_R2_ACCESS_KEY_ID: ${{ secrets.FLAQ_BUNDLED_R2_ACCESS_KEY_ID }}
          FLAQ_BUNDLED_R2_SECRET_ACCESS_KEY: ${{ secrets.FLAQ_BUNDLED_R2_SECRET_ACCESS_KEY }}
          FLAQ_BUNDLED_R2_BUCKET_NAME: ${{ secrets.FLAQ_BUNDLED_R2_BUCKET_NAME }}
          FLAQ_BUNDLED_R2_PUBLIC_DOMAIN: ${{ secrets.FLAQ_BUNDLED_R2_PUBLIC_DOMAIN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: Flaq Creator Desktop v__VERSION__
          releaseBody: |
            ## 中文

            Flaq Creator 1.1.0 是一次桌面端内容体验、媒体管理与连接稳定性更新。本版本提供 macOS Apple Silicon、macOS Intel 和 Windows x64 安装包。

            ### 新功能与改进

            - 新增素材库，内置 Qwen Image 3.0、Wan 3.0、MiniMax H3 和 Seedance 2.5 分类的完整提示词与示例素材。
            - 全新提示词详情查看器：保留原图比例，支持 100%–300% 缩放、拖动查看、三态分栏和小屏响应式布局。
            - 生成历史移入设置中心，支持图片与视频预览、下载和本地媒体管理。
            - 桌面端“记住我”改用与端口无关的 `auth.json` 保存 Client Key，并补充授权检测和脱敏日志。
            - 改进生成请求与媒体归档的瞬时网络错误重试，降低“生成成功但保存失败”的概率。
            - 安装包可携带打包时加密的默认 Cloudflare R2 预设，同时保留自定义 R2 预设。
            - Windows 新增与应用主题一致的桌面标题栏和窗口控件。

            ### 下载选择

            - Apple Silicon Mac（M1/M2/M3/M4 等）：`aarch64.dmg`
            - Intel Mac：`x64.dmg`
            - Windows 10/11 x64：推荐 `x64-setup.exe`；需要 MSI 部署时选择 `x64_en-US.msi`

            ### 安装提示

            当前安装包尚未使用 Apple Developer ID 或 Windows 代码签名。首次打开时，macOS Gatekeeper 或 Windows SmartScreen 可能显示安全提示。

            ---

            ## English

            Flaq Creator 1.1.0 improves desktop content discovery, media management, and connection reliability. This release includes installers for macOS Apple Silicon, macOS Intel, and Windows x64.

            ### What’s new

            - Added a curated media library with complete prompt examples for Qwen Image 3.0, Wan 3.0, MiniMax H3, and Seedance 2.5.
            - Introduced a redesigned prompt-detail viewer that preserves source aspect ratios and supports 100%–300% zoom, panning, three panel modes, and responsive small-screen layouts.
            - Moved generation history into Settings with image and video previews, downloads, and local media management.
            - Desktop “Remember me” now stores the Client Key in a port-independent `auth.json`, with improved authorization diagnostics and redacted logs.
            - Added retry handling for transient generation-request and media-archive failures, reducing cases where generation succeeds but local saving fails.
            - Packaged installers can include a build-time encrypted default Cloudflare R2 preset while retaining reusable custom R2 presets.
            - Added a theme-aware native-style title bar and window controls on Windows.

            ### Which file should I download?

            - Apple Silicon Mac (M1/M2/M3/M4 and later): `aarch64.dmg`
            - Intel Mac: `x64.dmg`
            - Windows 10/11 x64: use `x64-setup.exe`, or `x64_en-US.msi` for MSI deployment.

            ### Installation note

            These installers are not yet signed with an Apple Developer ID or Windows code-signing certificate. macOS Gatekeeper or Windows SmartScreen may display a security warning on first launch.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --target ${{ matrix.target }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flaq-creator-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
