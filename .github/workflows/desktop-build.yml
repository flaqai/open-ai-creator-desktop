name: Desktop release
run-name: Desktop ${{ github.event_name == 'push' && github.ref_name || inputs.target }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Candidate package target (manual runs never publish a Release)
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  preflight:
    name: Preflight and desktop web build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      notes: ${{ steps.metadata.outputs.notes }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-preflight

      - name: Verify release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: >-
          node scripts/desktop-release.mjs metadata --tag "${RELEASE_TAG}" --target "${RELEASE_TARGET}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks once
        run: pnpm check

      - name: Run Rust tests once
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build reusable desktop frontend
        run: pnpm build:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package and smoke ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.id }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: desktop-web-${{ github.sha }}
          path: out

      - name: Build native bundles from the reusable frontend
        env:
          FLAQ_DESKTOP_PREBUILT_OUT: 'true'
          FLAQ_REQUIRE_BUNDLED_R2: 'true'
          FLAQ_BUNDLED_R2_ACCOUNT_ID: ${{ secrets.FLAQ_BUNDLED_R2_ACCOUNT_ID }}
          FLAQ_BUNDLED_R2_ACCESS_KEY_ID: ${{ secrets.FLAQ_BUNDLED_R2_ACCESS_KEY_ID }}
          FLAQ_BUNDLED_R2_SECRET_ACCESS_KEY: ${{ secrets.FLAQ_BUNDLED_R2_SECRET_ACCESS_KEY }}
          FLAQ_BUNDLED_R2_BUCKET_NAME: ${{ secrets.FLAQ_BUNDLED_R2_BUCKET_NAME }}
          FLAQ_BUNDLED_R2_PUBLIC_DOMAIN: ${{ secrets.FLAQ_BUNDLED_R2_PUBLIC_DOMAIN }}
        run: >-
          pnpm exec tauri build --ci --no-sign --target ${{ matrix.rustTarget }} --bundles ${{ matrix.bundles }}

      - name: Normalize candidate filenames
        env:
          CANDIDATE_TARGET: ${{ matrix.id }}
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          node scripts/desktop-release.mjs normalize \
            --target "$CANDIDATE_TARGET" \
            --bundle-root "src-tauri/target/$RUST_TARGET/release/bundle" \
            --output dist/candidate

      - name: Smoke macOS package
        if: startsWith(matrix.id, 'macos-')
        env:
          CANDIDATE_TARGET: ${{ matrix.id }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.id == 'macos-arm64' && 'arm64' || 'x86_64' }}
        run: |
          node scripts/smoke-macos-release.mjs \
            "dist/candidate/Flaq-Creator-$CANDIDATE_TARGET.dmg" \
            "$RELEASE_VERSION" \
            "$EXPECTED_ARCH"

      - name: Smoke Windows packages
        if: matrix.id == 'windows-x64'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          & scripts/smoke-windows-release.ps1 `
            -Installer dist/candidate/Flaq-Creator-windows-x64-setup.exe `
            -Msi dist/candidate/Flaq-Creator-windows-x64.msi `
            -Version $env:RELEASE_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ matrix.id }}
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Verify and publish complete Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-candidate-*
          path: dist/candidates

      - name: Assemble and verify release files
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/desktop-release.mjs assemble \
            --input dist/candidates \
            --output dist/release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ needs.preflight.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null); then
            if [ "$(printf '%s' "$release_json" | jq -r .isDraft)" != 'true' ]; then
              echo "Published release $RELEASE_TAG already exists and is immutable." >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --yes
          fi

      - name: Upload a hidden draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_NOTES: ${{ needs.preflight.outputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --target "${{ github.sha }}" \
            --title "Flaq Creator Desktop v${RELEASE_VERSION}" \
            --notes-file "$RELEASE_NOTES" \
            dist/release/*

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets > dist/remote-release.json
          node scripts/desktop-release.mjs verify-remote \
            --directory dist/release \
            --metadata dist/remote-release.json \
            --commit "${{ github.sha }}"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
