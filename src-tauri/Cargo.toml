[package]
name = "flaq-creator"
version = "1.0.0"
description = "A focused desktop workspace for creating images and videos with Flaq AI"
authors = ["Flaq AI"]
edition = "2021"

[lib]
name = "flaq_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util"] }
